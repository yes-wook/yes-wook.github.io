theme: jekyll-theme-chirpy

plugins:
  - jekyll-redirect-from

lang: ko-KR
timezone: Asia/Seoul

title: "Yes, Wook"
tagline: "일도 낭만도 예스"
description: >-
  데이터 플랫폼 엔지니어 김정욱이 일과 낭만, 그 사이의 기록을 남기는 공간입니다

url: "https://yes-wook.github.io"
baseurl: ""

# DO NOT modify this unless you are confident enough to update the code of all other post links.
permalink: /posts/:title/

github:
  username: yes-wook

social:
  name: "김정욱"
  links:
    - https://github.com/yes-wook
    - https://www.linkedin.com/in/yeswook/

avatar: "/img/profile.jpg"

toc: true

comments:
  provider: giscus
  giscus:
    repo: "yes-wook/yes-wook.github.io"
    repo_id: "MDEwOlJlcG9zaXRvcnkxNjU2MDQ0Nzk="
    category: "Announcements"
    category_id: "DIC_kwDOCd7sf84DE2BG"
    mapping: pathname
    strict: "0"
    input_position: bottom
    lang: ko
    reactions_enabled: "1"

paginate: 10

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

exclude:
  - _archive
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
