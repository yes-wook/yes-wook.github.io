<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">삭제 워크로드의 시간 분포</title>
  <desc id="diagram-desc">삭제 작업은 대상 탐색과 스캔에 50분대가 걸렸고, 재작성은 5초 미만이었습니다. Bloom Filter 유무에 따른 파일과 바이트 프루닝 차이는 없었습니다.</desc>
  <style>
    text { font-family: 'Noto Sans CJK KR', sans-serif; }
    .mono { font-family: 'Noto Sans Mono CJK KR', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="12" y="12" width="616" height="576" rx="14" fill="#0f172a"/>
  <rect x="12" y="12" width="616" height="576" rx="14" fill="rgba(8,51,68,0.16)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="38" y="61" fill="#67e8f9" font-size="27" font-weight="700">삭제 워크로드 · 시간이 든 곳</text>
  <text x="38" y="102" fill="#cbd5e1" font-size="22">같은 조건에서 Bloom Filter 유무를 비교했습니다.</text>
  <rect x="38" y="142" width="564" height="156" rx="10" fill="#1e1b1f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="66" y="190" fill="#fbbf24" font-size="26" font-weight="700">1. 삭제할 대상을 찾고 스캔</text>
  <text x="66" y="254" fill="#fef3c7" font-size="48" font-weight="700">50분대</text>
  <text x="336" y="246" fill="#cbd5e1" font-size="24">파일·바이트 프루닝</text>
  <text x="336" y="279" fill="#cbd5e1" font-size="24">차이 없음</text>
  <line x1="320" y1="322" x2="320" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="38" y="381" width="564" height="132" rx="10" fill="#161b2d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="66" y="429" fill="#c4b5fd" font-size="26" font-weight="700">2. Deletion Vector 반영</text>
  <text x="66" y="478" fill="#f8fafc" font-size="27">재작성은 5초 미만</text>
  <text x="66" y="552" fill="#67e8f9" font-size="28" font-weight="700">병목은 재작성이 아니라 스캔이었습니다.</text>
</svg>
